<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/estilo.css">
  <title>Canteiro</title>
</head>
<body data-titulo="titulo.cliente">
  <main>
    <form id="form" class="cartao-form" novalidate>
      <h1 id="titulo-pagina" data-i18n="cliente.titulo_novo"></h1>
      <div class="grade-form">
        <div class="largo"><label for="nome" data-i18n="campo.nome"></label><input id="nome" maxlength="100" required><span class="erro-campo" id="erro-nome"></span></div>
        <div><label for="email" data-i18n="campo.email"></label><input id="email" type="email" maxlength="150" required><span class="erro-campo" id="erro-email"></span></div>
        <div><label for="cpf" data-i18n="campo.cpf"></label><input id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required><span class="erro-campo" id="erro-cpf"></span></div>
        <div><label for="telefone" data-i18n="campo.telefone"></label><input id="telefone" type="tel" maxlength="20" placeholder="(19) 99999-9999"><span class="erro-campo" id="erro-telefone"></span></div>
        <div><label for="cidade" data-i18n="campo.cidade"></label><input id="cidade" maxlength="80"><span class="erro-campo" id="erro-cidade"></span></div>
      </div>
      <p id="msg" class="msg" role="alert"></p>
      <div class="acoes">
        <button class="btn" type="submit" data-i18n="cadastro.salvar"></button>
        <a class="btn btn-sec" href="clientes.html" data-i18n="cadastro.cancelar"></a>
      </div>
    </form>
  </main>
  <footer class="rodape"><p data-i18n="rodape"></p></footer>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cliente.js"></script>
</body>
</html>
